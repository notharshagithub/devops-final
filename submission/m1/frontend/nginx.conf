server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Backend API -> FastAPI service (compose: backend:8000, k8s: taskboard-backend:8000)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /api/tasks/stats {
    proxy_pass http://backend:8000;
  }
  location /health {
    proxy_pass http://backend:8000;
  }
  location /ready {
    proxy_pass http://backend:8000;
  }
  location /docs {
    proxy_pass http://backend:8000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
