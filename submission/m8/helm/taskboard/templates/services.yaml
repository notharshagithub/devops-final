apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: taskboard-backend
spec:
  type: ClusterIP
  selector:
    app: taskboard-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: taskboard-frontend
spec:
  type: ClusterIP
  selector:
    app: taskboard-frontend
  ports:
    - port: 80
      targetPort: 8080
      name: http
