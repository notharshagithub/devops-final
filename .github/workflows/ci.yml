name: TaskBoard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-frontend

jobs:
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest (quality gate)
        working-directory: backend
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-scan-push:
    name: Build + Trivy scan + Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image (SHA tag)
        run: docker build -t $BACKEND_IMAGE:${{ github.sha }} ./backend

      - name: Build frontend image (SHA tag)
        run: docker build -t $FRONTEND_IMAGE:${{ github.sha }} ./frontend

      - name: Trivy scan backend (fail on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan frontend (fail on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push backend to GHCR
        run: docker push $BACKEND_IMAGE:${{ github.sha }}

      - name: Push frontend to GHCR
        run: docker push $FRONTEND_IMAGE:${{ github.sha }}

  deploy:
    name: Deploy via Helm
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig (self-hosted / EKS)
        run: |
          echo "Configure KUBECONFIG via secrets in repo settings."
          echo "Example: aws eks update-kubeconfig --region ap-south-1 --name taskboard-eks"

      - name: Helm upgrade
        run: |
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard --create-namespace \
            --set images.backend.repository=$BACKEND_IMAGE \
            --set images.backend.tag=${{ github.sha }} \
            --set images.frontend.repository=$FRONTEND_IMAGE \
            --set images.frontend.tag=${{ github.sha }}
